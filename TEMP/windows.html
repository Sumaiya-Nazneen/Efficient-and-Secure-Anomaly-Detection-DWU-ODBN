{% extends "base.html" %}

{% block body %}

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 2rem;
    background: #121212;
    color: #eee;
  }
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 0.5rem;
  }
  select, textarea, button {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    background: #1f1f1f;
    color: #eee;
  }
  button {
    background: #3d89fb;
    cursor: pointer;
    border: none;
    font-weight: bold;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #2a66cc;
  }
  #result {
    font-size: 1.1rem;
    padding: 1rem;
    background: #222;
    border-radius: 6px;
    min-height: 40px;
    white-space: pre-wrap;
    word-break: break-word;
  }
    h4 {
    margin-bottom: 1.5rem;
    color: #3d89fb;
  }

</style>

<h4 style="margin-top:20px;text-align:center">Windows Anomaly Detection</h4>

<label for="windows-version">Select Windows Version:</label>
<select id="windows-version">
  <option value="7">Windows 7</option>
  <option value="10">Windows 10</option>
</select>

<label for="features-input">Paste Feature Array (JSON format):</label>
<textarea id="features-input" rows="8" placeholder='[0, 93.54, 0, 0.05, ...]'></textarea>

<button id="predict-btn">Predict</button>

<div id="result" class="mb-4"></div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  document.getElementById('predict-btn').addEventListener('click', async () => {
    const version = document.getElementById('windows-version').value;
    const featureText = document.getElementById('features-input').value.trim();
    const resultDiv = document.getElementById('result');

    if (!featureText) {
      Swal.fire('Error', 'Please paste the feature array JSON.', 'error');
      return;
    }

    let features;
    try {
      features = JSON.parse(featureText);
      if (!Array.isArray(features)) {
        throw new Error('Input must be a JSON array');
      }
    } catch (err) {
      Swal.fire('Error', 'Invalid JSON format: ' + err.message, 'error');
      return;
    }

    const payload = {
      os_type: version,
      features: features
    };

    resultDiv.textContent = 'Predicting...';

    try {
      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        // Format detailed prediction output
        let html = `<strong>Prediction:</strong> ${data.prediction}<br>`;
        if (data.confidence !== undefined) {
          html += `<strong>Confidence:</strong> ${(data.confidence * 100).toFixed(2)}%<br>`;
        }
        if (data.severity) {
          html += `<strong>Severity Level:</strong> ${data.severity}<br>`;
        }
        if (data.description) {
          html += `<strong>Description:</strong> ${data.description}<br>`;
        }
        if (data.recommended_actions && data.recommended_actions.length > 0) {
          html += `<strong>Recommended Actions:</strong><ul>`;
          data.recommended_actions.forEach(action => {
            html += `<li>${action}</li>`;
          });
          html += `</ul>`;
        }
        if (data.timestamp) {
          html += `<small>Timestamp: ${new Date(data.timestamp).toLocaleString()}</small><br>`;
        }
        if (data.model_version) {
          html += `<small>Model Version: ${data.model_version}</small>`;
        }
        resultDiv.innerHTML = html;
      } else {
        throw new Error(data.message || 'Prediction failed');
      }
    } catch (err) {
      resultDiv.textContent = '';
      Swal.fire('Error', err.message, 'error');
    }
  });
</script>

{% endblock body %}
